<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="240" height="68" fill="none">
    <!-- Logotipo oficial puntoAR con fondo exterior transparente para adaptarse a cualquier fondo -->
    <defs>
        <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
        <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
    </defs>
    <!-- Capsula / Pildora oscura protectora con bordes redondeados y fondo transparente exterior -->
    <rect x="6" y="6" width="228" height="56" rx="28" fill="#1e293b" filter="url(#badgeShadow)"/>
    <!-- Tipografia: 'punto' en blanco brillante -->
    <text x="36" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" fill="#ffffff" letter-spacing="-0.03em">punto</text>
    <!-- Tipografia: 'AR' en ambar calido -->
    <text x="141" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="35" font-weight="900" fill="url(#arGrad)" letter-spacing="0.02em">AR</text>
    <!-- Punto o indicador naranja distintivo -->
    <circle cx="204" cy="37" r="5.5" fill="#f59e0b"/>
</svg>
